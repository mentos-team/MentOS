name: Ubuntu

# Trigger the workflow on push or pull requests for main and develop branches
on:
  push:
    branches:
    - main
    - develop
    paths:
    - '**/*.c'
    - '**/*.cpp'
    - '**/*.h'
    - '**/*.hpp'
    - '**/*.S'
    - '**/*.asm'
    - '**/CMakeLists.txt'
    - '**/Makefile'
    - '**/cmake/**'
    - 'scripts/**'
    - 'iso/**'
    - 'filesystem/**'
    - 'tools/**'
    - '.github/workflows/ubuntu.yml'
  pull_request:
    branches:
    - main
    - develop
    paths:
    - '**/*.c'
    - '**/*.cpp'
    - '**/*.h'
    - '**/*.hpp'
    - '**/*.S'
    - '**/*.asm'
    - '**/CMakeLists.txt'
    - '**/Makefile'
    - '**/cmake/**'
    - 'scripts/**'
    - 'iso/**'
    - 'filesystem/**'
    - 'tools/**'
    - '.github/workflows/ubuntu.yml'

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build and Compile
    strategy:
      fail-fast: false
      matrix:
        include:
          [
            { pkgs: "nasm gcc-14 g++-14", cc: gcc-14, cxx: g++-14, os: ubuntu-latest },
            { pkgs: "nasm clang-19 clang++-19", cc: clang-19, cxx: clang++-19, os: ubuntu-latest }
          ]
    runs-on: ${{ matrix.os }}
    # Set environment variables
    env:
      # We globally set CC and CXX.
      CC: ${{ matrix.cc }}
      CXX: ${{ matrix.cxx }}
    steps:
    - name: Clone repository
      uses: actions/checkout@v4
    - name: Install dependencies
      run: |
        sudo apt-get update
        sudo apt-get install -y ${{ matrix.pkgs }}
    - name: Build
      run: |
        cmake -B build -DCMAKE_BUILD_TYPE=Release
        cmake --build build --parallel $(nproc)

  test:
    name: Build and Test
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
    - name: Clone repository
      uses: actions/checkout@v4

    - name: Install test dependencies
      run: |
        sudo apt-get update
        sudo apt-get install -y nasm gcc-9 g++-9 qemu-system-x86 mtools xorriso

    - name: Configure
      run: |
        cmake -B build \
          -DCMAKE_BUILD_TYPE=Release \
          -DEMULATOR_OUTPUT_TYPE=OUTPUT_LOG

    - name: Run tests
      run: |
        cmake --build build --parallel $(nproc) --target qemu-test
      timeout-minutes: 12

    - name: Show test log
      if: always()
      run: |
        echo "=== Test Output ==="
        cat build/test.log || echo "test.log not found"

    - name: Show serial log
      if: always()
      run: |
        echo "=== Serial Output ==="
        cat build/serial.log || echo "serial.log not found"

    - name: Archive the logs
      if: always()
      uses: actions/upload-artifact@v4
      with:
        name: logs
        path: |
          build/test.log
          build/serial.log
