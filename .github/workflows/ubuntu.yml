name: Ubuntu

# Trigger the workflow on push or pull requests for main and develop branches
on:
  push:
    branches:
    - main
    - develop
    paths:
    - '**/*.c'
    - '**/*.cpp'
    - '**/*.h'
    - '**/*.hpp'
    - '**/*.S'
    - '**/*.asm'
    - '**/CMakeLists.txt'
    - '**/Makefile'
    - '**/cmake/**'
    - 'scripts/**'
    - 'iso/**'
    - 'filesystem/**'
    - 'tools/**'
    - '.github/workflows/ubuntu.yml'
  pull_request:
    branches:
    - main
    - develop
    # No paths filter here on purpose: a status check that a filter keeps
    # from starting stays pending for ever once it is required, and the
    # pull request has no way out of it. The push trigger above still
    # filters.

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build and Compile
    strategy:
      fail-fast: false
      matrix:
        include:
          [
            { pkgs: "nasm gcc-14 g++-14", cc: gcc-14, cxx: g++-14, os: ubuntu-latest },
            { pkgs: "nasm clang-19 clang++-19", cc: clang-19, cxx: clang++-19, os: ubuntu-latest }
          ]
    runs-on: ${{ matrix.os }}
    # Set environment variables
    env:
      # We globally set CC and CXX.
      CC: ${{ matrix.cc }}
      CXX: ${{ matrix.cxx }}
    steps:
    - name: Clone repository
      uses: actions/checkout@v4
    - name: Install dependencies
      run: |
        sudo apt-get update
        sudo apt-get install -y ${{ matrix.pkgs }}
    - name: Build
      run: |
        cmake -B build -DCMAKE_BUILD_TYPE=Release
        cmake --build build --parallel $(nproc)

  test:
    name: Build and Test
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
    - name: Clone repository
      uses: actions/checkout@v4

    - name: Install test dependencies
      run: |
        sudo apt-get update
        sudo apt-get install -y nasm gcc-9 g++-9 qemu-system-x86 mtools xorriso

    - name: Configure
      run: |
        cmake -B build \
          -DCMAKE_BUILD_TYPE=Release \
          -DEMULATOR_OUTPUT_TYPE=OUTPUT_LOG

    - name: Run tests
      run: |
        cmake --build build --parallel $(nproc) --target qemu-test
      timeout-minutes: 12

    - name: Show test log
      if: always()
      run: |
        echo "=== Test Output ==="
        cat build/test.log || echo "test.log not found"

    - name: Show serial log
      if: always()
      run: |
        echo "=== Serial Output ==="
        cat build/serial.log || echo "serial.log not found"

    - name: Archive the logs
      if: always()
      uses: actions/upload-artifact@v4
      with:
        name: logs
        path: |
          build/test.log
          build/serial.log

  kernel-tests:
    name: Kernel Unit Tests
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
    - name: Clone repository
      uses: actions/checkout@v4

    - name: Install test dependencies
      run: |
        sudo apt-get update
        sudo apt-get install -y nasm gcc-9 g++-9 qemu-system-x86 mtools xorriso

    # A job of its own, and not a step of "Build and Test": the kernel suites
    # report a failure by panicking, which would take the userspace suite's
    # result down with them and leave nothing to read.
    - name: Configure
      run: |
        cmake -B build-kernel-tests \
          -DCMAKE_BUILD_TYPE=Debug \
          -DENABLE_KERNEL_TESTS=ON \
          -DEMULATOR_OUTPUT_TYPE=OUTPUT_LOG

    - name: Run the kernel unit tests
      run: |
        cmake --build build-kernel-tests --parallel $(nproc) --target qemu-kernel-test
      timeout-minutes: 5

    - name: Show serial log
      if: always()
      run: |
        echo "=== Serial Output ==="
        cat build-kernel-tests/kernel-test-serial.log || echo "kernel-test-serial.log not found"

    - name: Archive the log
      if: always()
      uses: actions/upload-artifact@v4
      with:
        name: kernel-test-logs
        path: build-kernel-tests/kernel-test-serial.log
