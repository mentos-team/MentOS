name: macOS

# Trigger the workflow on push or pull requests for main and develop branches
on:
  push:
    branches:
    - main
    - develop
    paths:
    - '**/*.c'
    - '**/*.cpp'
    - '**/*.h'
    - '**/*.hpp'
    - '**/*.S'
    - '**/*.asm'
    - '**/CMakeLists.txt'
    - '**/Makefile'
    - '**/cmake/**'
    - 'scripts/**'
    - 'tools/**'
    - '**/tools/toolchain-i686-elf.cmake'
    - '.github/workflows/macos.yml'
  pull_request:
    branches:
    - main
    - develop
    # No paths filter here on purpose: a status check that a filter keeps
    # from starting stays pending for ever once it is required, and the
    # pull request has no way out of it. The push trigger above still
    # filters.

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build and Compile (macOS)
    runs-on: macos-15
    timeout-minutes: 30
    steps:
    - name: Clone repository
      uses: actions/checkout@v4

    - name: Install dependencies via Homebrew
      run: |
        brew update || true
        brew install nasm cmake i686-elf-gcc e2fsprogs
        echo "=== Checking installed tools ==="
        nasm --version
        cmake --version
        i686-elf-gcc --version
        # Deliberately NOT added to PATH: e2fsprogs is keg-only on macOS, and
        # the build is supposed to find mke2fs and debugfs on its own. Leaving
        # PATH alone is what exercises that lookup (#391).
        ls "$(brew --prefix e2fsprogs)/sbin"

    - name: Build with cross-compilation toolchain
      run: |
        mkdir -p build
        cd build
        cmake .. -DCMAKE_TOOLCHAIN_FILE=../tools/toolchain-i686-elf.cmake -DCMAKE_BUILD_TYPE=Release
        cmake --build . --parallel $(sysctl -n hw.ncpu)

    # The filesystem target is where macOS diverges from Linux: it shells out
    # to mke2fs and debugfs, and debugfs reads its command file into a
    # BUFSIZ-sized buffer that is 1024 here against 8192 with glibc. Building
    # only the default target left all of that uncovered, and #391 was
    # reported by a user who could not build at all while this job was green.
    - name: Build the filesystem image
      run: |
        cd build
        cmake --build . --parallel $(sysctl -n hw.ncpu) --target filesystem

    - name: Verify build artifacts
      run: |
        echo "=== Build artifacts ==="
        ls -lh build/mentos/ || echo "mentos/ not found"
        ls -lh build/*.bin 2>/dev/null || echo "*.bin files not found"
        file build/mentos/bootloader.bin 2>/dev/null || echo "bootloader.bin not found"

